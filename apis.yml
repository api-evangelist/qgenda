aid: qgenda
name: QGenda
description: >-
  QGenda is a healthcare workforce management platform used by hospitals, health systems, medical
  groups, and academic medical centers for physician and staff scheduling, on-call management,
  provider credentialing, time tracking, and clinical operations. Its public REST API (version 2)
  exposes 146 operations across scheduling, open shifts, rotations, staff members, tasks, time-off
  requests and limits, pay codes and rates, locations, credentialing, notifications, and workflows.
  The API uses token-based authentication via a login endpoint, serves JSON over HTTPS (TLS 1.2/1.3
  only), supports BR/GZip compression, and offers OData query parameters on select resources. Backed
  by ICONIQ Capital.
